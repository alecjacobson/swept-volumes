[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "swept-volumes"
version = "0.1.0"
description = "Swept Volumes via Spacetime Numerical Continuation (nanobind bindings)"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
dependencies = ["numpy"]

[project.optional-dependencies]
numba = ["numba"]
test = ["pytest", "numba"]

[project.urls]
Homepage = "https://github.com/alecjacobson/swept-volumes"

[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build/skbuild/{wheel_tag}"
wheel.packages = ["python/swept_volumes"]
cmake.version = ">=3.20"

[tool.scikit-build.cmake.define]
SWEPT_VOLUMES_PYTHON = "ON"
SWEPT_VOLUMES_BENCH = "OFF"
SWEPT_VOLUMES_GUI = "OFF"
CMAKE_POLICY_VERSION_MINIMUM = "3.5"

[tool.pytest.ini_options]
markers = [
    "slow: end-to-end runs that take many seconds (deselect with '-m \"not slow\"')",
]
